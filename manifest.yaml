appVersion: apps/v1
kind: Deployment
metadata:
  name: my-fido2-server
  namespace: default
  labels:
    app: my-fido2-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-fido2-server
  template:
    metadata:
      labels:
        app: my-fido2-server
  spec:
    containers:
      - name: my-fido2-server
        image: my-fido2-server:latest
        ports:
          - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: my-fido2-server
  namespace: default
spec:
  selector:
    app: my-fido2-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer